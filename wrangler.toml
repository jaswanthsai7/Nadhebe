name = "nadhebe"
compatibility_date = "2025-07-25"
compatibility_flags = ["nodejs_compat"]
main = "worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"

[ai]
binding = "AI"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1



# ── Perchboard sales (see docs/PERCHBOARD_SALES_SETUP.md) ─────────────────────
# 1. npx wrangler kv namespace create PERCH_KV      → paste the id below, then uncomment
# [[kv_namespaces]]
# binding = "PERCH_KV"
# id = "PASTE_KV_NAMESPACE_ID_HERE"

# 2. npx wrangler r2 bucket create perchboard-downloads   → uncomment
#    npx wrangler r2 object put perchboard-downloads/Perchboard-Setup.exe --file=PATH\TO\Perchboard-Setup.exe --remote
# [[r2_buckets]]
# binding = "PERCH_DOWNLOADS"
# bucket_name = "perchboard-downloads"

# 3. Non-secret settings. Switch PADDLE_ENV to "production" when you go live.
[vars]
PADDLE_ENV = "sandbox"
MAIL_FROM = "Perchboard <licenses@nadhebe.com>"
SUPPORT_EMAIL = "support@nadhebe.com"
SITE_URL = "https://nadhebe.com"
PERCH_INSTALLER_KEY = "Perchboard-Setup.exe"
# PERCH_PRICE_IDS = "pri_xxx,pri_yyy"   # optional: only these prices get a license

# 4. Secrets (never put these in this file). Run each once:
#    npx wrangler secret put PADDLE_WEBHOOK_SECRET
#    npx wrangler secret put PADDLE_API_KEY
#    npx wrangler secret put RESEND_API_KEY
#    npx wrangler secret put LICENSE_PRIVATE_KEY      (from: node scripts/perch-license-keys.mjs)
